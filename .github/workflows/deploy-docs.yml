name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/Infrastructure/LingFan.Media.Abstractions/**'
      - 'src/Infrastructure/LingFan.Media.Extensions/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      # Deploy always builds from FRESHLY generated output, so a stale committed
      # reference (author forgot `pnpm docs:gen`) never breaks the published site.
      # Translation refresh is best effort; gen falls back to source text on gaps.
      - name: Refresh translation memory (best effort)
        working-directory: docs
        continue-on-error: true
        run: pnpm docs:translate --locale en

      - name: Generate API reference
        working-directory: docs
        run: pnpm docs:gen

      - name: Quality gate (post-regeneration)
        working-directory: docs
        run: pnpm docs:check

      - name: Build site
        working-directory: docs
        run: pnpm docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
