# Sync GitHub → Gitee mirror

name: Sync to Gitee

on:
  push:

concurrency:
  group: sync-gitee-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror repository to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          # 完整镜像克隆（含所有分支与 tag），再强制推送到 Gitee
          git clone --mirror "https://github.com/${{ github.repository }}.git" mirror-tmp
          cd mirror-tmp
          git remote set-url origin "https://${{ github.repository_owner }}:${GITEE_TOKEN}@gitee.com/${{ github.repository_owner }}/LingFan.Media.git"
          git push --mirror
