# NuGet Build & Publish workflow for LingFan.Media
#
# Pairs with the NuGet.org Trusted Publisher policy:
#   Owner: MoFeng | Repository: LingFan.Media | Workflow: nuget_build.yml
#   Environment: production
# Authentication is OIDC trusted publishing (no long-lived API key): the job
# has `id-token: write` + `environment: production`; the "NuGet login" step
# exchanges the GitHub OIDC token for a short-lived NuGet API key, which the
# "Publish" step passes via `--api-key`. NuGet.org matches it against the
# Trusted Publishing policy (Owner=MoFeng / Repo=LingFan.Media /
# Workflow=nuget_build.yml / Environment=production).
#
# Project conventions honored here:
# - .NET 10 SDK; V1 is Windows-only, so we use `windows-latest` (D3D11 + Skia +
#   WASAPI; FFmpeg / LibVLC / MediaFoundation backends).
# - We deliberately do NOT run `dotnet test`. Tests use minimal Probe binaries
#   under src/Tools/* for local validation; xunit is disabled.
# - NuGet brand metadata (authors / license / icon / readme) is centralized in
#   Directory.Build.props and inherited by every IsPackable=true project.
# - Packages are pushed to BOTH nuget.org (Trusted Publishing / OIDC) and GitHub
#   Packages (GITHUB_TOKEN, this repo's "Packages" tab). GitHub Packages needs
#   `permissions.packages: write`; the source URL is per-owner
#   (nuget.pkg.github.com/<owner>/index.json).
# - We build/pack `nuget.slnx` (library projects only). The `src/Tools/*` sample
#   apps / Probes are excluded on purpose: they produce no NuGet package and the
#   mobile targets (Android / iOS / Browser) fail Release trimming on CI.
#   Local dev can still open `LingFan.Media.slnx` to build/run the Tools in Debug.

name: NuGet Build & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only (skip publish to NuGet.org)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Pack & Publish NuGet packages
    runs-on: windows-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # 纳入所有影响依赖的配置文件，确保修改后缓存自动失效
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "0.0.0-ci.$($env:GITHUB_RUN_NUMBER)"
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Resolved PACKAGE_VERSION=$version"

          # 提取纯数字版本（去掉 -alpha/-beta/-rc 等预发布后缀）
          # 专门用于 AssemblyVersion / FileVersion，解决 CS7034/CS7035 编译错误
          $cleanVersion = $version -replace '-.*$', ''
          # 补全为 主.次.生成.修订 四段格式，不足补 .0
          $parts = $cleanVersion.Split('.')
          while ($parts.Count -lt 4) {
            $cleanVersion += '.0'
            $parts = $cleanVersion.Split('.')
          }
          "ASSEMBLY_VERSION=$cleanVersion" >> $env:GITHUB_ENV
          Write-Host "Resolved ASSEMBLY_VERSION=$cleanVersion"

      - name: Restore
        run: dotnet restore nuget.slnx

      - name: Build
        run: >-
          dotnet build nuget.slnx -c Release --no-restore
          -p:Version=${{ env.PACKAGE_VERSION }}
          -p:InformationalVersion=${{ env.PACKAGE_VERSION }}
          -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
          -p:FileVersion=${{ env.ASSEMBLY_VERSION }}
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true

      - name: Pack
        run: >-
          dotnet pack nuget.slnx -c Release --no-build --no-restore
          -o ./artifacts
          -p:Version=${{ env.PACKAGE_VERSION }}
          -p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: List packed packages
        shell: pwsh
        run: |
          Get-ChildItem ./artifacts -Filter '*.nupkg' |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: NuGet login (OIDC → temp API key)
        id: login
        # 受信任发布：用 GitHub OIDC token 向 nuget.org 换一次性临时 key（约 1h 有效）。
        # 须在本仓库 Secrets 配置 NUGET_USER = 你的 nuget.org 用户名（profile name，非邮箱），
        # 且该用户名下已建好匹配本仓库/工作流/环境的 Trusted Publishing 策略。
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org (OIDC trusted publishing)
        # 修复发布条件：Tag 推送自动发布；手动触发时 dry_run=false 可执行发布
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgs = Get-ChildItem ./artifacts -Filter '*.nupkg' -File
          if (-not $pkgs) {
            Write-Error "No .nupkg files found under ./artifacts"
            exit 1
          }
          foreach ($pkg in $pkgs) {
            Write-Host "Pushing $($pkg.Name) ($([math]::Round($pkg.Length/1KB, 1)) KB) ..."
            dotnet nuget push $pkg.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --skip-duplicate `
              --no-symbols `
              --source https://api.nuget.org/v3/index.json
            # 显式检查推送退出码，失败立即终止，杜绝静默失败
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to push package: $($pkg.Name)"
              exit $LASTEXITCODE
            }
          }

      - name: Publish to GitHub Packages (NuGet)
        # 同一批 nupkg 同时推到 GitHub Packages，使仓库 “Packages” 页自动列出。
        # 鉴权用 GITHUB_TOKEN（自动注入），需上方 permissions 含 packages: write。
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgs = Get-ChildItem ./artifacts -Filter '*.nupkg' -File
          if (-not $pkgs) {
            Write-Error "No .nupkg files found under ./artifacts"
            exit 1
          }
          $ghSource = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          foreach ($pkg in $pkgs) {
            Write-Host "Pushing $($pkg.Name) to GitHub Packages ($([math]::Round($pkg.Length/1KB, 1)) KB) ..."
            dotnet nuget push $pkg.FullName `
              --api-key "${{ secrets.GITHUB_TOKEN }}" `
              --skip-duplicate `
              --no-symbols `
              --source $ghSource
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to push package to GitHub Packages: $($pkg.Name)"
              exit $LASTEXITCODE
            }
          }
